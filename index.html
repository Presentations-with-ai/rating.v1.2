<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Рейтинг студентов</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --line: rgba(148, 163, 184, .24);
      --line-strong: rgba(99, 102, 241, .28);
      --surface: rgba(255, 255, 255, .94);
      --surface-soft: rgba(248, 250, 252, .92);
      --primary: #4f46e5;
      --primary-2: #7c3aed;
      --success: #059669;
      --danger: #dc2626;
      --shadow-lg: 0 24px 70px rgba(17, 24, 39, .22);
      --shadow-md: 0 14px 38px rgba(17, 24, 39, .15);
      --shadow-sm: 0 8px 20px rgba(17, 24, 39, .08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(26px, env(safe-area-inset-top)) 0 max(44px, env(safe-area-inset-bottom));
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(92vw, 480px); }
    .card {
      position: relative;
      z-index: 2;
      background: var(--surface);
      width: 100%;
      padding: clamp(18px, 4vw, 26px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, .62);
      box-shadow: var(--shadow-lg);
      animation: fade .35s cubic-bezier(.2,.8,.2,1);
      text-align: center;
      color: var(--ink);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: visible;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
    }
    @keyframes fade { from { opacity:0; transform: translateY(10px) scale(.99); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes riseIn { from { opacity:0; transform: translateY(14px) scale(.985); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes softPop { 0% { transform: scale(.98); } 55% { transform: scale(1.015); } 100% { transform: scale(1); } }
    @keyframes sheen { from { transform: translateX(-130%) skewX(-18deg); } to { transform: translateX(170%) skewX(-18deg); } }
    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124,58,237,0); }
      50% { box-shadow: 0 0 0 5px rgba(124,58,237,.10); }
    }
    @keyframes ripple {
      from { opacity: .42; transform: translate(-50%, -50%) scale(0); }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }
    .topBar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    h1 { margin: 0; font-size: 28px; line-height: 1.08; letter-spacing: 0; text-align:left; }
    .yearSelect {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      outline: none;
      background: var(--surface-soft);
      color: var(--ink);
      border-radius: 16px;
      padding: 11px 10px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      max-width: 132px;
      box-shadow: var(--shadow-sm);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .yearSelect:hover { transform: translateY(-1px); border-color: var(--line-strong); }
    .yearSelect:focus { border-color: var(--primary-2); background:#fff; box-shadow: 0 0 0 4px rgba(124,58,237,.13), var(--shadow-sm); }
    .search { display: grid; gap: 11px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      outline: none;
      background: var(--surface-soft);
      color: var(--ink);
      border-radius: 18px;
      padding: 16px 15px;
      font-size: 16px;
      font-weight: 650;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.76);
    }
    input:hover { border-color: rgba(99,102,241,.25); }
    input:focus { border-color: var(--primary-2); background:#fff; box-shadow: 0 0 0 4px rgba(124,58,237,.13), var(--shadow-sm); }
    input::placeholder { color: #9ca3af; font-weight: 600; }
    .actions { display:grid; grid-template-columns: 1fr; gap: 10px; }
    button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px 16px;
      background: linear-gradient(135deg, #4338ca 0%, var(--primary-2) 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(79,70,229,.28);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    button::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: -35%;
      bottom: -35%;
      left: 0;
      width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
      opacity: 0;
      transform: translateX(-130%) skewX(-18deg);
      pointer-events: none;
    }
    button:hover::before {
      opacity: 1;
      animation: sheen .9s ease;
    }
    button:focus-visible,
    input:focus-visible,
    .yearSelect:focus-visible,
    .searchLink:focus-visible {
      outline: 3px solid rgba(124,58,237,.24);
      outline-offset: 3px;
    }
    button:disabled::before { display: none; }
    .tapRipple {
      position: absolute;
      z-index: 2;
      width: 18px;
      height: 18px;
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      pointer-events: none;
      animation: ripple .62s ease-out forwards;
    }
    button:hover { filter: brightness(1.04); box-shadow: 0 18px 36px rgba(91,33,182,.30); transform: translateY(-1px); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .58; cursor: not-allowed; box-shadow: none; transform: none; }
    .groupBtn {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-sm);
    }
    .miniStats {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 16px;
    }
    .mini {
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(248,250,252,.92));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 11px 7px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .mini:hover {
      transform: translateY(-2px);
      border-color: rgba(99,102,241,.28);
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.78);
    }
    .mini b { display:block; font-size: 17px; color:var(--ink); line-height: 1.05; }
    .mini span { display:block; margin-top: 4px; font-size: 10px; color:var(--muted); font-weight:800; }
    .results { display: grid; gap: 13px; margin-top: 16px; }
    .resultCard {
      background: var(--surface);
      border-radius: 22px;
      padding: 17px;
      border: 1px solid rgba(255,255,255,.56);
      box-shadow: var(--shadow-md);
      color:var(--ink);
      animation: fade .28s cubic-bezier(.2,.8,.2,1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .results .resultCard { animation: riseIn .34s cubic-bezier(.2,.8,.2,1) both; }
    .results .resultCard:nth-child(2) { animation-delay: .035s; }
    .results .resultCard:nth-child(3) { animation-delay: .07s; }
    .results .resultCard:nth-child(4) { animation-delay: .105s; }
    .results .resultCard:nth-child(5) { animation-delay: .14s; }
    .results .resultCard:nth-child(6) { animation-delay: .175s; }
    .resultCard:hover { transform: translateY(-3px); box-shadow: 0 20px 50px rgba(17, 24, 39, .20); border-color: rgba(255,255,255,.76); }
    .empty { text-align:center; color:var(--muted); font-weight:700; line-height: 1.45; }
    .moreBox { display:grid; gap:10px; margin-top: 2px; }
    .moreInfo { text-align:center; color:var(--muted); font-size:13px; font-weight:800; }
    .moreBtn {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-sm);
    }
    .moreBtn:hover { box-shadow: 0 14px 28px rgba(17,24,39,.15); }
    .studentTop { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .studentName { text-align:left; font-weight:900; line-height:1.18; font-size:18px; letter-spacing:0; }
    .studentMeta { text-align:left; margin-top:6px; color:var(--muted); font-size:12px; font-weight:750; }
    .rank {
      min-width: 88px;
      flex: 0 0 auto;
      border-radius: 17px;
      background: linear-gradient(180deg, #eef2ff, #f5f3ff);
      color: var(--primary);
      border: 1px solid var(--line-strong);
      padding: 9px 8px;
      text-align: center;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
      animation: softPop .42s ease both;
    }
    .rank b { display:block; font-size: 19px; line-height:1; }
    .rank span { display:block; margin-top:4px; font-size:10px; color:#6366f1; }
    .grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 14px; }
    .cell { background:var(--surface-soft); border:1px solid var(--line); border-radius:16px; padding:12px 11px; box-shadow: inset 0 1px 0 rgba(255,255,255,.72); transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .cell:hover { transform: translateY(-1px); border-color: rgba(99,102,241,.26); background:#ffffff; }
    .cell span { display:block; font-size:10px; color:var(--muted); font-weight:850; margin-bottom:5px; }
    .cell b { display:block; font-size:15px; color:var(--ink); line-height: 1.25; }
    .groupCard {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      cursor:pointer;
      border: 1px solid rgba(255,255,255,.56);
      text-align:left;
    }
    .groupName { font-size:19px; font-weight:900; color:var(--ink); line-height:1.1; }
    .groupMeta { margin-top:6px; color:var(--muted); font-size:12px; font-weight:800; }
    .groupPill {
      flex: 0 0 auto;
      border-radius: 16px;
      padding: 10px 12px;
      min-width: 72px;
      background:#eef2ff;
      color:var(--primary);
      text-align:center;
      font-size:18px;
      font-weight:900;
      border: 1px solid var(--line-strong);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .groupCard:hover .groupPill { transform: scale(1.04); box-shadow: 0 10px 22px rgba(79,70,229,.16); }

    .suggestions {
      display: none;
      margin-top: -2px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.98);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      text-align: left;
    }
    .suggestions.show { display: block; }
    .suggestions.show { animation: riseIn .22s cubic-bezier(.2,.8,.2,1) both; }
    .suggestionItem {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #f3f4f6;
      background: #fff;
      color: var(--ink);
      box-shadow: none;
      border-radius: 0;
      padding: 13px 14px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      transition: background .16s ease, padding-left .16s ease;
    }
    .suggestionItem:last-child { border-bottom: 0; }
    .suggestionItem:hover { filter: none; background: #f9fafb; box-shadow: none; padding-left: 18px; }
    .suggestionItem:active { transform: none; }
    .suggestionName { font-weight: 900; color: var(--ink); }
    .suggestionCount { font-size: 12px; color: var(--primary); font-weight: 900; background: #eef2ff; border-radius: 999px; padding: 5px 9px; }

    .suggestionText { min-width: 0; }
    .suggestionName { display:block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggestionMeta { display:block; margin-top: 4px; font-size: 11px; color:var(--muted); font-weight:800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell b { word-break: break-word; }
    .facultyBadge {
      display:inline-flex;
      align-items:center;
      margin-top: 8px;
      padding: 6px 9px;
      border-radius: 999px;
      background:#f0fdf4;
      color:var(--success);
      border:1px solid #bbf7d0;
      font-size: 11px;
      font-weight:900;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .facultyBadge:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(5,150,105,.12); }
    .searchLink {
      display: inline;
      width: auto;
      min-width: 0;
      min-height: 0;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      box-shadow: none;
      font: inherit;
      font-weight: inherit;
      text-align: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      cursor: pointer;
      overflow: visible;
      isolation: auto;
      line-height: inherit;
    }
    .searchLink::before { display: none; }
    .searchLink:hover {
      filter: none;
      box-shadow: none;
      color: var(--primary);
    }
    .searchLink:active { transform: none; }
    .facultyBadge .searchLink { color:var(--success); }


    .calcHeaderBtn {
      width: auto;
      padding: 11px 13px;
      border-radius: 16px;
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-sm);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      animation: pulseRing 2.8s ease-in-out infinite;
    }
    .mainTitle { margin-bottom: 16px; }
    .calcPage {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow-y: auto;
      background: #f2f4f8;
      color: #1f2937;
      padding: 18px;
    }
    .calcPage[hidden] { display: none; }
    .calcApp {
      max-width: 760px;
      margin: 0 auto;
    }
    .calcNav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .calcBackBtn {
      width: auto;
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      padding: 12px 14px;
      border-radius: 16px;
    }
    .calcPage .calcTop { margin-bottom: 18px; }
    .calcPage h2 {
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 6px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }
    .calcSubtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.4;
      margin: 0;
    }
    .calcResultCard {
      background: #ffffff;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }
    .calcResultTitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .calcGpa {
      font-size: 42px;
      font-weight: 900;
      color: #22963f;
      margin-bottom: 8px;
    }
    .calcSmallInfo {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }
    .calcSubjects {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .calcSubject {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
    }
    .calcSubjectHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .calcSubjectTitle {
      font-weight: 800;
      font-size: 18px;
    }
    .calcDeleteBtn {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      padding: 0;
      box-shadow: none;
    }
    .calcGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .calcPage label {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .calcGradeBadge {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .calcButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .calcPage .calcAddBtn {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(37,99,235,.20);
    }
    .calcPage .calcClearBtn {
      background: #e5e7eb;
      color: #111827;
      box-shadow: none;
    }
    .calcTableCard {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }
    .calcTableTitle {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 12px;
    }
    .calcPage table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }
    .calcPage th, .calcPage td {
      padding: 10px 6px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    .calcPage th {
      color: #6b7280;
      font-size: 13px;
    }
    .calcGreen { color: #22963f; font-weight: 800; }
    .calcOrange { color: #b7791f; font-weight: 800; }
    .calcRed { color: #dc2626; font-weight: 800; }
    @media (max-width: 520px) {
      .topBar { gap: 8px; }
      .calcHeaderBtn { font-size: 12px; padding: 9px 9px; }
      .calcPage { padding: 14px; }
      .calcPage h2 { font-size: 28px; }
      .calcGrid { grid-template-columns: 1fr; }
      .calcButtons { grid-template-columns: 1fr; }
      .calcGpa { font-size: 38px; }
      .topBar {
        display: grid;
        grid-template-columns: 1fr;
      }
      .calcHeaderBtn,
      .yearPicker,
      .yearPickerBtn {
        width: 100%;
        max-width: none;
      }
      .yearMenu {
        display: none;
        position: static;
        width: 100%;
        margin-top: 8px;
        transform: translateY(-4px) scale(.98);
      }
      .yearPicker.open .yearMenu {
        display: grid;
        transform: translateY(0) scale(1);
      }
    }

    #tgFrame { display:none; width:0; height:0; border:0; }

    /* Big visual upgrade: everything above the unchanged page background. */
    .page {
      width: min(94vw, 560px);
      perspective: 1100px;
    }
    .card {
      padding: clamp(20px, 4.4vw, 30px);
      border-radius: 30px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.96), rgba(244,247,255,.90)),
        rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow:
        0 30px 90px rgba(24, 18, 72, .30),
        0 10px 26px rgba(17, 24, 39, .14),
        inset 0 1px 0 rgba(255,255,255,.95);
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(79,70,229,.16), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(16,185,129,.16), transparent 28%),
        radial-gradient(circle at 20% 88%, rgba(236,72,153,.10), transparent 30%);
      mix-blend-mode: multiply;
      opacity: .9;
    }
    .topBar,
    .mainTitle,
    .search,
    .miniStats {
      position: relative;
      z-index: 1;
    }
    .topBar {
      z-index: 80;
    }
    .search,
    .miniStats {
      z-index: 5;
    }
    .topBar {
      align-items: stretch;
      gap: 10px;
    }
    h1.mainTitle {
      max-width: 12ch;
      margin-bottom: 18px;
      font-size: clamp(31px, 5vw, 42px);
      line-height: .96;
      font-weight: 950;
      color: #0f172a;
      text-shadow: 0 1px 0 rgba(255,255,255,.65);
    }
    .calcHeaderBtn,
    .yearSelect {
      min-height: 46px;
      border-radius: 18px;
      background: rgba(255,255,255,.78);
      box-shadow:
        0 12px 26px rgba(31, 41, 55, .12),
        inset 0 1px 0 rgba(255,255,255,.86);
    }
    .calcHeaderBtn {
      flex: 1 1 auto;
      background: linear-gradient(135deg, #111827, #4338ca 48%, #7c3aed);
      color: #fff;
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: 0 16px 34px rgba(67,56,202,.33);
    }
    .yearSelect {
      flex: 0 0 145px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #4f46e5 50%),
        linear-gradient(135deg, #4f46e5 50%, transparent 50%),
        linear-gradient(135deg, rgba(255,255,255,.9), rgba(241,245,249,.92));
      background-position:

    function esc(v) {

    function getGrade(score) {
      score = Number(score);
      if (isNaN(score)) return null;
      if (score < 0 || score > 100) return null;
      if (score >= 90) return 5;
      if (score >= 70) return 4;
      if (score >= 60) return 3;
      return 2;
    }

    function getGradeText(score) {
      const grade = getGrade(score);
      if (grade === null) return "Введите балл от 0 до 100";
      return `Балл: ${score} → оценка: ${grade}`;
    }

    function renderCalc() {
      subjectsBox.innerHTML = "";
      subjects.forEach((subject, index) => {
        const div = document.createElement("div");
        div.className = "calcSubject";
        div.innerHTML = `
          <div class="calcSubjectHeader">
            <div class="calcSubjectTitle">${esc(subject.name)}</div>
            <button class="calcDeleteBtn" type="button" onclick="deleteSubject(${index})">×</button>
          </div>
          <div class="calcGrid">
            <div>
              <label>Балл</label>
              <input type="number" inputmode="decimal" min="0" max="100" placeholder="Например: 91" value="${esc(subject.score)}" oninput="updateScore(${index}, this.value)" />
            </div>
            <div>
              <label>Кредит</label>
              <input type="number" inputmode="decimal" min="1" placeholder="Например: 5" value="${esc(subject.credit)}" oninput="updateCredit(${index}, this.value)" />
            </div>
          </div>
          <div class="calcGradeBadge">${esc(getGradeText(subject.score))}</div>
        `;
        subjectsBox.appendChild(div);
      });
      calculateGPA();
    }

    function calculateGPA() {
      let totalCredits = 0;
      let totalPoints = 0;
      let validSubjects = 0;

      subjects.forEach(subject => {
        const score = Number(subject.score);
        const credit = Number(subject.credit);
        const grade = getGrade(score);
        if (grade !== null && credit > 0) {
          totalCredits += credit;
          totalPoints += grade * credit;
          validSubjects++;
        }
      });

      if (totalCredits === 0) {
        gpaResult.textContent = "0.00 / 5";
        summary.textContent = "Предметов: 0 · Кредитов: 0 · Сумма: 0";
        return;
      }

      const gpa = totalPoints / totalCredits;
      gpaResult.textContent = `${gpa.toFixed(2)} / 5`;
      summary.textContent = `Предметов: ${validSubjects} · Кредитов: ${totalCredits} · Сумма: ${totalPoints}`;
    }

    function translitWord(raw) {
      const lower = String(raw).toLowerCase();
      const map = {
        "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya",
        "ў":"o‘","қ":"q","ғ":"g‘","ҳ":"h","і":"i","ї":"yi","є":"ye","ң":"ng","ү":"u","ұ":"u","ә":"a","ө":"o"
      };
      let out = "";
      for (const ch of lower) out += (map[ch] ?? ch);
      return out;
    }

    function titleCaseLatin(text) {
      return text.replace(/[A-Za-zÀ-ž‘'`-]+/g, word => {
        if (!word) return word;
        return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
      });
    }

    function hasCyrillic(text) {
      return /[А-Яа-яЁёЎўҚқҒғҲҳІіЇїЄє]/.test(String(text));
    }

    function toLatinQuery(text) {
      const value = String(text ?? "").trim();
      if (!hasCyrillic(value)) return value;
      return titleCaseLatin(translitWord(value)).replace(/\s+/g, " ").trim();
    }

    function norm(v) {
      return String(v ?? "")
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[‘’ʼ`´']/g, "")
        .replace(/[^A-Z0-9А-ЯЁЎҚҒҲІЇЄ\s\/-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function rank(v) { return v === null || v === undefined || v === "" ? "—" : "#" + v; }
    function g(s, key, shortKey) { return s[key] ?? s[shortKey] ?? ""; }

    function groupKey(value) {
      return norm(value).replace(/\s+/g, "");
    }

    function makeSearchButton(value, label = value) {
      const safeValue = esc(value || "—");
      const safeLabel = esc(label || value || "—");
      if (!value || value === "—") return safeLabel;
      return `<button class="searchLink" type="button" data-search="${safeValue}">${safeLabel}</button>`;
    }

    function setSearchValue(value) {

      doSearch();
    }

    function buildFacultiesDirectory(json) {
      FACULTY_GROUP_MAP = new Map();
      directoryGroupStats = [];
      directoryFacultyStats = [];

      const faculties = Array.isArray(json?.faculties) ? json.faculties : [];

      for (const faculty of faculties) {
        const facultyName = String(faculty?.name || "").trim();
        if (!facultyName) continue;

        const groupSet = new Set();
        const courses = Array.isArray(faculty?.courses) ? faculty.courses : [];

        for (const course of courses) {
          const courseName = String(course?.name || "").trim();
          const groups = Array.isArray(course?.groups) ? course.groups : [];

          for (const group of groups) {
            const groupName = String(group?.name || group || "").trim();
            if (!groupName) continue;

            groupSet.add(groupName);
            FACULTY_GROUP_MAP.set(groupKey(groupName), facultyName);
            FACULTY_BY_GROUP[groupName] = facultyName;
            FACULTY_BY_GROUP[groupName.toUpperCase()] = facultyName;

            directoryGroupStats.push({
              name: groupName,
              count: 0,
              levels: courseName || "—",
              faculty: facultyName,
              search: norm([groupName, facultyName, courseName].join(" "))
            });
          }
        }

        directoryFacultyStats.push({
          name: facultyName,
          count: 0,
          groups: groupSet.size,
          search: norm([facultyName, ...groupSet].join(" "))
        });
      }
    }

    async function loadFacultiesDirectory() {
      try {
        const res = await fetch(FACULTIES_FILE, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        FACULTIES_DATA = await res.json();
        buildFacultiesDirectory(FACULTIES_DATA);
      } catch (e) {
        console.warn("Не удалось загрузить", FACULTIES_FILE, e);
        FACULTIES_DATA = null;
        FACULTY_GROUP_MAP = new Map();
        directoryGroupStats = [];
        directoryFacultyStats = [];
      }
    }

    function firstExisting(obj, keys) {
      for (const key of keys) {
        const value = obj?.[key];
        if (value !== null && value !== undefined && String(value).trim() !== "") return value;
      }
      return "";
    }

    function getTalabaIdRaw(s) {
      return firstExisting(s, [
        "student_id_number",
        "talaba_id",
        "talabaId",
        "talabaID",
        "studentIdNumber",
        "student_number",
        "studentNumber",
        "student_code",
        "studentCode",
        "id_number"
      ]);
    }

    function getFacultyRaw(s) {
      const direct = firstExisting(s, ["faculty", "faculty_name", "facultyName", "fac", "department", "department_name"]);
      if (direct) return direct;

      const groupName = String(g(s, "group_name", "gr") || "").trim();
      const fromJson = FACULTY_GROUP_MAP.get(groupKey(groupName));
      if (fromJson) return fromJson;

      const exact = FACULTY_BY_GROUP[groupName] || FACULTY_BY_GROUP[groupName.toUpperCase()];
      if (exact) return exact;

      for (const rule of FACULTY_RULES) {
        if (rule.pattern.test(groupName)) return rule.faculty;
      }

      return "—";
    }

    function getRankQuery(raw) {
      const m = String(raw || "").trim().match(/^#\s*(\d+)$/);
      return m ? Number(m[1]) : null;
    }

    function makeStudentSearchText(s) {
      return norm([
        s.fn,
        s.sn,
        s.gr,
        s.lv,
        s.faculty,
        s.talabaId,
        s.talabaId ? `TALABA ${s.talabaId}` : "",
        s.u ? `RANK ${s.u} ${s.u}` : "",
        s.r ? `GROUPRANK ${s.r}` : ""
      ].join(" "));
    }

    function scoreStudent(s, q, rankNo) {
      if (rankNo !== null) return Number(s.u) === rankNo ? 999999 : 0;

      const full = norm(s.fn);
      const short = norm(s.sn);
      const group = norm(s.gr);
      const faculty = norm(s.faculty);
      const talaba = norm(s.talabaId);
      let score = 0;

      if (full === q) score += 5000;
      if (full.startsWith(q)) score += 2500;
      if (short === q) score += 1800;
      if (group === q) score += 1600;
      if (group.startsWith(q)) score += 900;
      if (talaba && talaba === q) score += 6000;
      if (talaba && talaba.startsWith(q)) score += 2500;
      if (faculty === q) score += 1200;
      if (faculty.startsWith(q)) score += 650;
      score += Math.max(0, 100 - Number(s.u || 999999));

      return score;
    }

    function findStudents(raw, limit = Infinity) {
      const converted = toLatinQuery(raw);
      const rankNo = getRankQuery(converted);
      const q = norm(converted);
      if (!q && rankNo === null) return [];

      let list;
      if (rankNo !== null) {
        list = prepared.filter(s => Number(s.u) === rankNo);
      } else {
        const terms = q.split(" ").filter(Boolean);
        list = prepared.filter(s => terms.every(t => s.search.includes(t)));
      }

      list = list
        .map(s => ({ ...s, score: scoreStudent(s, q, rankNo) }))
        .sort((a, b) => b.score - a.score || Number(a.u || 999999999) - Number(b.u || 999999999));

      return Number.isFinite(limit) ? list.slice(0, limit) : list;
    }

    function updateSearchSuggestions() {
      const raw = input.value.trim();
      const converted = toLatinQuery(raw);
      const q = norm(converted);
      const rankNo = getRankQuery(converted);
      if ((!q || q.length < 2) && rankNo === null) return hideGroupSuggestions();

      const suggestions = [];
      const used = new Set();

      for (const s of findStudents(converted, 3)) {
        const key = `student:${s.u}:${s.fn}`;
        if (used.has(key)) continue;
        used.add(key);
        suggestions.push({
          type: "student",
          value: s.fn,
          title: s.fn,
          meta: `${rank(s.u)} · ${s.gr || "—"} · ${s.faculty || "—"}${s.talabaId ? " · ID " + s.talabaId : ""}`,
          badge: rank(s.u)
        });
        if (suggestions.length >= 3) break;
      }

      if (suggestions.length < 3 && q) {
        const terms = q.split(" ").filter(Boolean);
        for (const g of groupStats
          .filter(x => terms.every(t => x.search.includes(t)))
          .sort((a, b) => Number(b.count || 0) - Number(a.count || 0) || a.name.localeCompare(b.name, "ru", { numeric: true }))) {
          const key = `group:${g.name}`;
          if (used.has(key)) continue;
          used.add(key);
          suggestions.push({
            type: "group",
            value: g.name,
            title: g.name,
            meta: `${g.faculty || "—"} · ${g.levels || "—"}`,
            badge: `${g.count} чел.`
          });
          if (suggestions.length >= 3) break;
        }
      }

      if (suggestions.length < 3 && q) {
        const terms = q.split(" ").filter(Boolean);
        for (const f of facultyStats
          .filter(x => terms.every(t => x.search.includes(t)))
          .sort((a, b) => Number(b.count || 0) - Number(a.count || 0) || a.name.localeCompare(b.name, "ru", { numeric: true }))) {
          const key = `faculty:${f.name}`;
          if (used.has(key)) continue;
          used.add(key);
          suggestions.push({
            type: "faculty",
            value: f.name,
            title: f.name,
            meta: `Факультет · ${f.groups} групп`,
            badge: `${f.count} чел.`
          });
          if (suggestions.length >= 3) break;
        }
      }

      if (!suggestions.length) return hideGroupSuggestions();

      groupSuggestions.innerHTML = suggestions.slice(0, 3).map(item => `
        <button class="suggestionItem" type="button" data-value="${esc(item.value)}">
          <span class="suggestionText">
            <span class="suggestionName">${esc(item.title)}</span>
            <span class="suggestionMeta">${esc(item.meta)}</span>
          </span>
          <span class="suggestionCount">${esc(item.badge)}</span>
        </button>
      `).join("");

      groupSuggestions.classList.add("show");
      groupSuggestions.querySelectorAll(".suggestionItem").forEach(item => {
        item.addEventListener("click", () => {
          input.value = item.dataset.value || "";
          hideGroupSuggestions();
          doSearch();
        });
      });
    }

    async function loadData() {
      try {
        STUDENTS = [];
        prepared = [];
        groupStats = [];
        facultyStats = [];
        currentResults = [];
        visibleCount = PAGE_SIZE;
        hasTalabaIds = false;
        foundEl.textContent = "—";
        totalEl.textContent = "—";
        groupsEl.textContent = "—";
        btn.disabled = true;
        hideGroupSuggestions();
        results.innerHTML = `<div class="resultCard empty">Загрузка базы...</div>`;

        await loadFacultiesDirectory();

        const selectedYear = yearSelect.value;
        const dataFile = DATA_FILES[selectedYear] || DATA_FILES["2025-2026"];
        const res = await fetch(dataFile, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        STUDENTS = Array.isArray(json) ? json : (json.students || []);
        prepared = STUDENTS.map(s => {
          const student = {
            ...s,
            fn: g(s, "full_name", "fn"),
            sn: g(s, "short_name", "sn"),
            gr: g(s, "group_name", "gr"),
            lv: g(s, "level_name", "lv"),
            u: g(s, "university_rank", "u"),
            r: g(s, "group_rank", "r"),
            t: g(s, "group_total", "t"),
            gpa: g(s, "gpa", "gpa"),
            cr: g(s, "credit_sum", "cr"),
            subjectsCount: g(s, "subjects", "subjects"),
            d: g(s, "debt_subjects", "d"),
            talabaId: getTalabaIdRaw(s),
            faculty: getFacultyRaw(s)
          };
          student.search = makeStudentSearchText(student);
          return student;
        });

        hasTalabaIds = prepared.some(s => String(s.talabaId || "").trim());
        makeStats();

        totalEl.textContent = prepared.length.toLocaleString("ru-RU");
        groupsEl.textContent = groupStats.length.toLocaleString("ru-RU");
        foundEl.textContent = "0";
        btn.disabled = false;
        const talabaHint = hasTalabaIds ? "" : `<br><span style="font-size:12px;color:#9ca3af">Talaba ID появится, когда в JSON будет поле student_id_number</span>`;
        results.innerHTML = `<div class="resultCard empty">Введите ФИО, группу, Talaba ID, #место или факультет${talabaHint}</div>`;
      } catch (e) {
        btn.disabled = true;
        totalEl.textContent = "—";
        groupsEl.textContent = "—";
        foundEl.textContent = "—";
        const selectedYear = yearSelect.value;
        const dataFile = DATA_FILES[selectedYear] || "JSON";
        results.innerHTML = `<div class="resultCard empty">Не удалось загрузить базу ${esc(selectedYear)}<br><span style="font-size:12px;color:#9ca3af">Проверь файл ${esc(dataFile)}</span></div>`;
      }
    }

    function makeStats() {
      const groupMap = new Map();
      const facultyMap = new Map();

      for (const s of prepared) {
        const groupName = s.gr || "—";
        const facultyName = s.faculty || "—";

        if (!groupMap.has(groupName)) groupMap.set(groupName, { name: groupName, count: 0, levels: new Set(), faculties: new Set() });
        const groupObj = groupMap.get(groupName);
        groupObj.count += 1;
        if (s.lv) groupObj.levels.add(s.lv);
        if (facultyName) groupObj.faculties.add(facultyName);

        if (!facultyMap.has(facultyName)) facultyMap.set(facultyName, { name: facultyName, count: 0, groups: new Set() });
        const facultyObj = facultyMap.get(facultyName);
        facultyObj.count += 1;
        if (groupName) facultyObj.groups.add(groupName);
      }

      for (const item of directoryGroupStats) {
        if (!groupMap.has(item.name)) {
          groupMap.set(item.name, {
            name: item.name,
            count: 0,
            levels: new Set(item.levels && item.levels !== "—" ? [item.levels] : []),
            faculties: new Set(item.faculty && item.faculty !== "—" ? [item.faculty] : [])
          });
        } else {
          const groupObj = groupMap.get(item.name);
          if (item.levels && item.levels !== "—") groupObj.levels.add(item.levels);
          if (item.faculty && item.faculty !== "—") groupObj.faculties.add(item.faculty);
        }
      }

      for (const item of directoryFacultyStats) {
        if (!facultyMap.has(item.name)) {
          facultyMap.set(item.name, { name: item.name, count: 0, groups: new Set() });
        }
      }

      groupStats = [...groupMap.values()].map(x => {
        const faculty = [...x.faculties].filter(Boolean).sort().join(", ");
        const levels = [...x.levels].sort().join(", ");
        return {
          name: x.name,
          count: x.count,
          levels,
          faculty,
          search: norm([x.name, faculty, levels].join(" "))
        };
      }).sort((a, b) => a.name.localeCompare(b.name, "ru", { numeric: true }));

      facultyStats = [...facultyMap.values()].map(x => ({
        name: x.name,
        count: x.count,
        groups: x.groups.size || (directoryFacultyStats.find(f => f.name === x.name)?.groups || 0),
        search: norm([x.name, ...x.groups].join(" ")) || (directoryFacultyStats.find(f => f.name === x.name)?.search || norm(x.name))
      })).sort((a, b) => a.name.localeCompare(b.name, "ru", { numeric: true }));
    }

    function doSearch() {
      hideGroupSuggestions();
      const original = input.value.trim();
      const converted = toLatinQuery(original);
      if (converted !== original) input.value = converted;

      if (!converted) {
        currentMode = "search";
        foundEl.textContent = "0";
        results.innerHTML = `<div class="resultCard empty">Введите ФИО, группу, Talaba ID, #место или факультет</div>`;
        return;
      }

      const list = findStudents(converted, Infinity);
      currentMode = "search";
      foundEl.textContent = list.length.toLocaleString("ru-RU");
      currentResults = list;
      visibleCount = PAGE_SIZE;
      renderStudents();
      sendToTelegram(converted, list);
    }

    function showGroups() {
      currentMode = "groups";
      currentResults = groupStats;
      visibleCount = PAGE_SIZE;
      foundEl.textContent = groupStats.length.toLocaleString("ru-RU");
      renderGroups();
    }

    function studentCard(s) {
      const talabaText = s.talabaId ? esc(s.talabaId) : `<span style="color:#9ca3af">Нет в JSON</span>`;
      return `
        <article class="resultCard">
          <div class="studentTop">
            <div>
              <div class="studentName">${esc(s.fn)}</div>
              <div class="studentMeta">${esc(s.sn || "")} · ${makeSearchButton(s.gr || "", s.gr || "—")} · ${esc(s.lv || "—")}</div>
              <div class="facultyBadge">${makeSearchButton(s.faculty || "", s.faculty || "—")}</div>
            </div>
            <div class="rank"><b>${rank(s.u)}</b><span>УНИВЕР</span></div>
          </div>
          <div class="grid">
            <div class="cell"><span>TALABA ID</span><b>${talabaText}</b></div>
            <div class="cell"><span>ФАКУЛЬТЕТ</span><b>${makeSearchButton(s.faculty || "", s.faculty || "—")}</b></div>
            <div class="cell"><span>ГРУППА</span><b>${makeSearchButton(s.gr || "", s.gr || "—")}</b></div>
            <div class="cell"><span>МЕСТО В ГРУППЕ</span><b>${rank(s.r)} / ${esc(s.t ?? "—")}</b></div>
            <div class="cell"><span>GPA</span><b>${esc(s.gpa ?? "—")}</b></div>
            <div class="cell"><span>КРЕДИТЫ</span><b>${esc(s.cr ?? "—")}</b></div>
            <div class="cell"><span>ФАНЛАР</span><b>${esc(s.subjectsCount ?? "—")}</b></div>
            <div class="cell"><span>ДОЛГИ</span><b>${esc(s.d ?? "—")}</b></div>
          </div>
        </article>
      `;
    }

    function groupCard(group) {
      return `
        <article class="resultCard groupCard" data-group="${esc(group.name)}">
          <div>
            <div class="groupName">${makeSearchButton(group.name, group.name)}</div>
            <div class="groupMeta">${makeSearchButton(group.faculty || "", group.faculty || "—")} · ${esc(group.levels || "—")}</div>
          </div>
          <div class="groupPill">${esc(group.count)}</div>
        </article>
      `;
    }

    function renderStudents() {
      const list = currentResults;
      if (!list.length) {
        results.innerHTML = `<div class="resultCard empty">Ничего не найдено</div>`;
        return;
      }
      const shown = Math.min(visibleCount, list.length);
      const part = list.slice(0, shown);
      let html = part.map(studentCard).join("");
      if (shown < list.length) html += moreBlock(shown, list.length);
      results.innerHTML = html;
      bindMoreButton();
    }

    function renderGroups() {
      const list = currentResults;
      if (!list.length) {
        results.innerHTML = `<div class="resultCard empty">Группы не найдены</div>`;
        return;
      }
      const shown = Math.min(visibleCount, list.length);
      const part = list.slice(0, shown);
      let html = part.map(groupCard).join("");
      if (shown < list.length) html += moreBlock(shown, list.length);
      results.innerHTML = html;
      bindMoreButton();
      document.querySelectorAll(".groupCard").forEach(card => {
        card.addEventListener("click", (e) => {
          if (e.target.closest(".searchLink")) return;
          setSearchValue(card.dataset.group || "");
        });
      });
    }

    function moreBlock(shown, total) {
      return `
        <div class="resultCard moreBox">
          <div class="moreInfo">Показано ${shown} из ${total}</div>
          <button class="moreBtn" id="moreBtn" type="button">Продолжить</button>
        </div>
      `;
    }

    function bindMoreButton() {
      const moreBtn = document.getElementById("moreBtn");
      if (moreBtn) {
        moreBtn.addEventListener("click", () => {
          visibleCount += PAGE_SIZE;
          if (currentMode === "groups") renderGroups();
          else renderStudents();
        });
      }
    }

    function syncYearPicker() {
      if (!yearPicker || !yearPickerValue || !yearMenu) return;
      yearPickerValue.textContent = yearSelect.value;
      yearMenu.querySelectorAll(".yearOption").forEach(option => {
        const isActive = option.dataset.value === yearSelect.value;
        option.classList.toggle("active", isActive);
        option.setAttribute("aria-selected", String(isActive));
      });
    }

    function closeYearPicker() {
      if (!yearPicker || !yearPickerBtn) return;
      yearPicker.classList.remove("open");
      yearPickerBtn.setAttribute("aria-expanded", "false");
    }

    function initYearPicker() {
      if (!yearPicker || !yearPickerBtn || !yearMenu) return;

      yearMenu.innerHTML = Array.from(yearSelect.options).map(option => `
        <button class="yearOption" type="button" role="option" data-value="${esc(option.value)}">
          ${esc(option.textContent)}
        </button>
      `).join("");

      yearPickerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const willOpen = !yearPicker.classList.contains("open");
        yearPicker.classList.toggle("open", willOpen);
        yearPickerBtn.setAttribute("aria-expanded", String(willOpen));
      });

      yearMenu.querySelectorAll(".yearOption").forEach(option => {
        option.addEventListener("click", (e) => {
          e.stopPropagation();
          yearSelect.value = option.dataset.value || yearSelect.value;
          syncYearPicker();
          closeYearPicker();
          yearSelect.dispatchEvent(new Event("change"));
        });
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".yearPicker")) closeYearPicker();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeYearPicker();
      });

      syncYearPicker();
    }

    function telegramText(query, list) {
      const when = new Date().toLocaleString("ru-RU");
      return `🔎 Поиск на сайте\n\nКого искали: ${query || "—"}\nНайдено: ${list.length}\nВремя: ${when}`;
    }

    function sendToTelegram(query, list) {
      if (!query.trim()) return;
      if (!BOT_TOKEN || !CHAT_ID || BOT_TOKEN.includes("PASTE_") || CHAT_ID.includes("PASTE_")) return;
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${encodeURIComponent(CHAT_ID)}&text=${encodeURIComponent(telegramText(query, list))}`;
      tgFrame.src = url;
    }

    btn.addEventListener("click", doSearch);
    input.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
    input.addEventListener("input", updateSearchSuggestions);
    input.addEventListener("focus", updateSearchSuggestions);
    yearSelect.addEventListener("change", () => {
      syncYearPicker();
      input.value = "";
      hideGroupSuggestions();
      loadData();
    });
    document.addEventListener("click", e => {
      const searchLink = e.target.closest(".searchLink");
      if (searchLink) {
        e.preventDefault();
        e.stopPropagation();
        setSearchValue(searchLink.dataset.search || searchLink.textContent || "");
        return;
      }

      if (!e.target.closest(".search")) hideGroupSuggestions();
    });
    calcOpenBtn.addEventListener("click", openCalc);
    calcBackBtn.addEventListener("click", closeCalc);
    initYearPicker();
    renderCalc();
    loadData();
  </script>
</body>
</html>
